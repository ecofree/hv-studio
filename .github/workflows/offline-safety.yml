name: Offline production safety

on:
  push:
    branches: [codex/p0-security-identity-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-safety-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DASHSCOPE_API_KEY: ''
      HV_API_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Capture the tested source revision
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci-evidence | Out-Null
          git rev-parse HEAD | Set-Content ci-evidence/revision.txt
          git archive --format=tar -o ci-evidence/source.tar HEAD
      - name: Preserve source for independent reproduction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safety-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/
          retention-days: 7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.core.lock.txt
      - name: Install the declared core environment
        run: python -m pip install -r requirements.core.lock.txt
      - name: Check dependency consistency and syntax
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q app bin tests
          exit $LASTEXITCODE
      - name: Run execution and safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_episode_execution.py tests/test_api_auth_gate.py tests/test_tts_uncertain_attempt.py tests/test_production_admission_audio_mode.py tests/test_production_readiness.py tests/test_rebuild_freeze_and_drift_split.py tests/test_unattended_operations.py tests/test_studio_process_repair.py tests/test_narration_closeout.py --junitxml=ci-evidence/safety.xml
          exit $LASTEXITCODE
      - name: Run the complete offline production suite
        shell: pwsh
        run: |
          python -m pytest -q -m production --junitxml=ci-evidence/production.xml
          exit $LASTEXITCODE
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safety-results-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-evidence/*.xml
          if-no-files-found: warn
          retention-days: 14
