name: Verify task identity contract

on:
  push:
    branches: [codex/p0-security-identity-hardening]
    paths:
      - '.ci/task-identity/**'
      - '.github/workflows/_task_identity_publish.yml'

permissions:
  contents: write

concurrency:
  group: task-identity-publication
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'ecofree/hv-studio' &&
      github.ref == 'refs/heads/codex/p0-security-identity-hardening' &&
      startsWith(github.event.head_commit.message, 'maintenance: verify task identity contract')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DASHSCOPE_API_KEY: ''
      HV_API_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.core.lock.txt
      - name: Apply only the checksum-pinned task contract patch
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, sys
          branch = 'refs/heads/codex/p0-security-identity-hardening'
          remote = subprocess.check_output(['git','ls-remote','origin',branch], text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch moved; refuse to overwrite concurrent work')
          part0 = pathlib.Path('.ci/task-identity/part0.txt').read_text().strip()
          # Correct one known transport duplication, then verify the complete patch.
          part0 = part0.replace('BOLgg8vbRZZsvys', 'BOLgg8vbRZsvys')
          encoded = part0 + pathlib.Path('.ci/task-identity/part1.txt').read_text().strip()
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(data).hexdigest()
          if digest != '8c27960692e414996551f625c6a046c958f43c4484dea6e79b1de6bdd102c54c':
              raise SystemExit('Task contract patch digest mismatch')
          patch = pathlib.Path(os.environ['RUNNER_TEMP'])/'task-identity.patch'
          patch.write_bytes(data)
          subprocess.run(['git','-c','core.autocrlf=false','apply','--index','--check',str(patch)], check=True)
          subprocess.run(['git','-c','core.autocrlf=false','apply','--index',str(patch)], check=True)
          allowed = {'app/services/batch_worker.py','app/services/episode_production.py','app/services/production_identity.py','app/services/production_status.py','app/services/provider_budget.py','app/services/queue_records.py','app/services/studio_jobs.py','bin/studio_job.py','docs/task-identity-contract.md','tests/_queue_fixture.py','tests/test_batch_repairs.py','tests/test_episode_execution.py','tests/test_task_identity.py','tests/test_unattended_operations.py'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected patch paths: '+repr(changed ^ allowed))
          subprocess.run(['git','diff','--cached','--check'], check=True)
          subprocess.run([sys.executable,'-m','compileall','-q','app','bin','tests'], check=True)
          evidence = pathlib.Path('ci-evidence'); evidence.mkdir(exist_ok=True)
          (evidence/'source.diff').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          (evidence/'source.json').write_text(json.dumps({'base':os.environ['GITHUB_SHA'],'patch_sha256':digest,'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(allowed)}},indent=2),encoding='utf-8')
      - name: Install the repository locked core environment
        run: python -m pip install -r requirements.core.lock.txt
      - name: Provision pinned media dependencies
        run: python .ci/setup-media.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run task identity and execution safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_task_identity.py tests/test_episode_execution.py tests/test_api_auth_gate.py tests/test_tts_uncertain_attempt.py tests/test_production_admission_audio_mode.py tests/test_production_readiness.py tests/test_rebuild_freeze_and_drift_split.py tests/test_unattended_operations.py tests/test_studio_process_repair.py tests/test_narration_closeout.py --junitxml=ci-evidence/task-safety.xml
          exit $LASTEXITCODE
      - name: Run the full offline production suite
        shell: pwsh
        run: |
          python -m pytest -q -m production --junitxml=ci-evidence/production.xml
          exit $LASTEXITCODE
      - name: Run affected shared and historical compatibility tests
        shell: pwsh
        run: |
          python -m pytest -q -m "shared or legacy" tests/test_hv_ops.py tests/test_production_hardening.py tests/test_production_regressions.py tests/test_output_binding_and_legacy_status.py tests/test_checkpoint_rotation.py --junitxml=ci-evidence/compatibility.xml
          exit $LASTEXITCODE
      - name: Preserve exact patch and real test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task-identity-${{ github.sha }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish only verified sources to the authorized branch
        shell: pwsh
        run: |
          $branch = 'refs/heads/codex/p0-security-identity-hardening'
          $remote = (git ls-remote origin $branch).Split()[0]
          if ($remote -ne $env:GITHUB_SHA) { throw 'Branch moved; do not overwrite concurrent work' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Tests modified tracked sources after validation' }
          git diff --cached --exit-code -- episodes resource designs workspace
          if ($LASTEXITCODE -ne 0) { throw 'Protected materials changed' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid staged source changes' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: bind Studio Batch and V2 executions to immutable task contracts'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:$branch
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; never force concurrent changes' }
