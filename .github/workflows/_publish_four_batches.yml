name: Verify four-batch changes before publication
on:
  push:
    branches: [codex/four-batch-production-hardening]
    paths: ['.ci/four-batch-patch/**', '.github/workflows/_publish_four_batches.yml']
permissions:
  contents: write
jobs:
  verify:
    if: >-
      github.repository == 'ecofree/hv-studio' &&
      github.ref == 'refs/heads/codex/four-batch-production-hardening' &&
      startsWith(github.event.head_commit.message, 'maintenance: verify four-batch patch')
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DASHSCOPE_API_KEY: ''
      HV_API_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.core.lock.txt
      - name: Verify bounded plain-text patch and source paths
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, sys
          branch='refs/heads/codex/four-batch-production-hardening'
          remote=subprocess.check_output(['git','ls-remote','origin',branch],text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']: raise SystemExit('Concurrent branch update; stop')
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          subprocess.run(['git','reset','--hard','HEAD'],check=True)
          data=''.join(pathlib.Path(f'.ci/four-batch-patch/part{i:02}.diff').read_text(encoding='utf-8') for i in range(7)).encode('utf-8')
          if hashlib.sha256(data).hexdigest()!='2d1f1255a34b31f9c8788a4c2bfea273d8be58668052d398509f95eb43de575a': raise SystemExit('Patch checksum mismatch')
          evidence=pathlib.Path('ci-evidence'); evidence.mkdir(exist_ok=True)
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'four-batches.patch';patch.write_bytes(data)
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          allowed=set(json.loads(pathlib.Path('.ci/four-batch-patch/paths.json').read_text()))
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed!=allowed:raise SystemExit('Unexpected changed paths '+repr(changed^allowed))
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run([sys.executable,'-m','compileall','-q','app','bin','tests'],check=True)
          (evidence/'source.patch').write_bytes(data)
          (evidence/'source.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'patch_sha256':hashlib.sha256(data).hexdigest(),'files':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(allowed)}},indent=2),encoding='utf-8')
      - name: Install locked core environment
        run: python -m pip install -r requirements.core.lock.txt
      - name: Install pinned media tools
        run: python .ci/setup-media.py
      - name: Check dependencies
        run: python -m pip check
      - name: Four-batch regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_four_batch_correctness.py tests/test_four_batch_recovery.py tests/test_acceptance_runner.py tests/test_resource_diagnostics.py --junitxml=ci-evidence/four-batches.xml
          exit $LASTEXITCODE
      - name: Existing task and safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_task_identity.py tests/test_task_identity_contention.py tests/test_task_attribution.py tests/test_episode_execution.py tests/test_api_auth_gate.py tests/test_tts_uncertain_attempt.py tests/test_production_admission_audio_mode.py tests/test_production_readiness.py tests/test_rebuild_freeze_and_drift_split.py tests/test_unattended_operations.py tests/test_studio_process_repair.py tests/test_narration_closeout.py --junitxml=ci-evidence/safety.xml
          exit $LASTEXITCODE
      - name: Complete production regression suite
        shell: pwsh
        run: |
          python -m pytest -q -m production --junitxml=ci-evidence/production.xml
          exit $LASTEXITCODE
      - name: Affected shared and legacy compatibility
        shell: pwsh
        run: |
          python -m pytest -q -m "shared or legacy" tests/test_hv_ops.py tests/test_production_hardening.py tests/test_production_regressions.py tests/test_output_binding_and_legacy_status.py tests/test_checkpoint_rotation.py --junitxml=ci-evidence/compatibility.xml
          exit $LASTEXITCODE
      - name: Preserve source and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: four-batch-publication-${{ github.sha }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish only tested code to the authorized branch
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          branch='refs/heads/codex/four-batch-production-hardening'
          remote=subprocess.check_output(['git','ls-remote','origin',branch],text=True).split()[0]
          if remote!=os.environ['GITHUB_SHA']: raise SystemExit('Concurrent update; no overwrite')
          evidence=json.loads(pathlib.Path('ci-evidence/source.json').read_text())
          for p,sha in evidence['files'].items():
              if hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=sha:raise SystemExit('Source changed during tests: '+p)
          subprocess.run(['git','diff','--exit-code','--','episodes','resource','designs','workspace'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','rm','-r','--','.ci/four-batch-patch','.github/workflows/_publish_four_batches.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat: complete four-batch correctness recovery acceptance and diagnostics tooling'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+branch],check=True)
