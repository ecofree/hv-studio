name: Bounded execution safety verification

on:
  push:
    branches: [codex/p0-security-identity-hardening]
    paths:
      - '.ci/execution-safety/**'
      - '.github/workflows/_round4_publish.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: >-
      github.repository == 'ecofree/hv-studio' &&
      github.ref == 'refs/heads/codex/p0-security-identity-hardening' &&
      startsWith(github.event.head_commit.message, 'maintenance: execute bounded safety patch')
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      DASHSCOPE_API_KEY: ''
      HV_API_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.core.lock.txt
      - name: Apply only the digest-pinned source changes
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, pathlib, subprocess, sys
          branch = 'refs/heads/codex/p0-security-identity-hardening'
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', branch], text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch moved; refuse to overwrite concurrent work')
          encoded = ''.join(pathlib.Path(f'.ci/execution-safety/part{i}.txt').read_text().strip() for i in range(4))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          digest = hashlib.sha256(data).hexdigest()
          if digest != 'c05ee5e799096b465a7cde8bd9b9763eb1aac327f7f9ddc89d9dae309e1f24c7':
              raise SystemExit('Updater digest mismatch')
          evidence = pathlib.Path('ci-evidence'); evidence.mkdir(exist_ok=True)
          updater = pathlib.Path(os.environ['RUNNER_TEMP']) / 'apply_execution_safety.py'
          updater.write_bytes(data)
          (evidence / 'applied-updater.py').write_bytes(data)
          subprocess.run([sys.executable, str(updater)], check=True)
          fix = pathlib.Path('.ci/execution-safety/fix1.py')
          if hashlib.sha256(fix.read_bytes()).hexdigest() != '0c7a40b24c3b9b3560ded88d09a4aee5f5fe7c8c420c40384624bbee2730744d':
              raise SystemExit('Test harness correction digest mismatch')
          subprocess.run([sys.executable, str(fix)], check=True)
          allowed = {'app/controllers/v1/auth.py','app/orchestrator.py','app/services/batch_worker.py','app/services/cosyvoice.py','app/services/narration_pipeline.py','app/services/production_readiness.py','app/services/production_storage.py','app/services/studio_jobs.py','bin/studio_job.py','bin/studio_narrate.py','docs/execution-guard-handoff.md','tests/test_api_auth_gate.py','tests/test_episode_execution.py','tests/test_production_admission_audio_mode.py','tests/test_tts_uncertain_attempt.py'}
          subprocess.run(['git', '-c', 'core.autocrlf=false', 'add', '--', *sorted(allowed)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected patch paths: ' + repr(changed ^ allowed))
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run([sys.executable, '-m', 'compileall', '-q', 'app', 'bin', 'tests'], check=True)
          (evidence / 'source.diff').write_bytes(subprocess.check_output(['git', 'diff', '--cached', '--binary']))
          (evidence / 'source.json').write_text(json.dumps({'base': os.environ['GITHUB_SHA'], 'updater_sha256': digest, 'files': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sorted(allowed)}}, indent=2), encoding='utf-8')
      - name: Install exact repository core environment
        run: python -m pip install -r requirements.core.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run execution and recovery regressions without providers
        shell: pwsh
        run: |
          python -m pytest -q tests/test_episode_execution.py tests/test_api_auth_gate.py tests/test_tts_uncertain_attempt.py tests/test_production_admission_audio_mode.py tests/test_production_readiness.py tests/test_rebuild_freeze_and_drift_split.py tests/test_unattended_operations.py tests/test_studio_process_repair.py tests/test_narration_closeout.py --junitxml=ci-evidence/execution.xml
          exit $LASTEXITCODE
      - name: Preserve exact patch and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: execution-safety-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish tested sources to the authorized branch only
        shell: pwsh
        run: |
          $branch = 'refs/heads/codex/p0-security-identity-hardening'
          $remote = (git ls-remote origin $branch).Split()[0]
          if ($remote -ne $env:GITHUB_SHA) { throw 'Branch moved; do not overwrite concurrent work' }
          git diff --exit-code -- episodes resource designs workspace
          if ($LASTEXITCODE -ne 0) { throw 'Protected materials changed' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid staged source changes' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify episode execution ownership and verify safety regressions'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:$branch
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; never force concurrent changes' }
