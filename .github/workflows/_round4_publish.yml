name: One-time tested execution patch
on:
  push:
    branches: [codex/p0-security-identity-hardening]
    paths: [.ci/round4.patch.gz.b64]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'ecofree/hv-studio' && github.ref == 'refs/heads/codex/p0-security-identity-hardening' && startsWith(github.event.head_commit.message, 'maintenance: apply tested execution patch')
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      DASHSCOPE_API_KEY: ''
      HV_API_TOKEN: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.core.lock.txt
      - name: Verify and apply the exact locally tested patch
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          branch = 'refs/heads/codex/p0-security-identity-hardening'
          remote = subprocess.check_output(['git','ls-remote','origin',branch], text=True).split()[0]
          if remote != os.environ['GITHUB_SHA']:
              raise SystemExit('Branch moved; refuse to overwrite concurrent work')
          data = gzip.decompress(base64.b64decode(pathlib.Path('.ci/round4.patch.gz.b64').read_text().strip(), validate=True))
          if hashlib.sha256(data).hexdigest() != '607f8fdbced0453d1ce171e0cc994a16755d989b486c024aa60580354b3d4ac2':
              raise SystemExit('Patch digest mismatch')
          allowed = {'app/controllers/v1/auth.py','app/orchestrator.py','app/services/batch_worker.py','app/services/cosyvoice.py','app/services/narration_pipeline.py','app/services/production_readiness.py','app/services/production_storage.py','app/services/studio_jobs.py','bin/studio_job.py','bin/studio_narrate.py','docs/execution-guard-handoff.md','tests/test_api_auth_gate.py','tests/test_episode_execution.py','tests/test_production_admission_audio_mode.py','tests/test_tts_uncertain_attempt.py'}
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tested-execution.patch'
          patch.write_bytes(data)
          subprocess.run(['git','-c','core.autocrlf=false','apply','--index','--check',str(patch)], check=True)
          subprocess.run(['git','-c','core.autocrlf=false','apply','--index',str(patch)], check=True)
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit('Unexpected patch paths: '+repr(changed ^ allowed))
          subprocess.run(['git','diff','--cached','--check'], check=True)
          subprocess.run(['python','-m','compileall','-q','app','bin','tests'], check=True)
      - name: Install exact repository core environment
        run: python -m pip install -r requirements.core.lock.txt
      - name: Execute isolated regressions before publishing
        run: python -m pytest -q tests/test_episode_execution.py tests/test_api_auth_gate.py tests/test_tts_uncertain_attempt.py tests/test_production_admission_audio_mode.py tests/test_production_readiness.py tests/test_rebuild_freeze_and_drift_split.py
      - name: Publish only the verified code changes to the authorized branch
        shell: pwsh
        run: |
          $branch = 'refs/heads/codex/p0-security-identity-hardening'
          $remote = (git ls-remote origin $branch).Split()[0]
          if ($remote -ne $env:GITHUB_SHA) { throw 'Branch moved; do not overwrite concurrent work' }
          git diff --exit-code -- episodes resource designs
          if ($LASTEXITCODE -ne 0) { throw 'Protected materials changed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: unify episode execution guards and verify safety regressions'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:$branch
          if ($LASTEXITCODE -ne 0) { throw 'Non-fast-forward or push failure; do not force' }
