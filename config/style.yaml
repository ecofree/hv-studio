# 全局风格规范
# 所有 episode 默认继承 ancient-realistic profile，可在 episode.json 中覆盖
version: 1.0

profiles:
  ancient-realistic:
    name: 古风写实

    # 生图走 gpt-image-2（API）
    image:
      engine: gpt-image-2
      size: [1024, 1792]          # HD 竖屏，成本最低档
      quality: low                # M1 迭代用 low；成片改 high
      # ⚠️ 必需：1024x1792 < 输出 1080x1920，不超分则达不到 1080p
      # 2x 超分 → 2048x3584；本地 12GB 显存，零 API 成本
      upscale: 2

      # gpt-image-2 无 negative_prompt 参数，负向约束写在 prompt 内
      style_suffix: >-
        ancient chinese historical painting style, cinematic composition,
        dramatic lighting, warm earthy tone, highly detailed, masterpiece,
        film grain
      negative_clause: >-
        No modern elements, no electric wires, no concrete, no text,
        no watermark, no signature, no extra limbs, no extra fingers,
        no mutated hands, no cartoon, no anime, no 3d render,
        no plastic skin.

      # 身份锚定块 —— gpt-image-2 角色一致性的核心
      # 原理：参考图会同时传递表情与姿态，若不显式覆盖，
      #       所有镜头都会复制定妆照的表情，观感诡异
      identity_anchor_template: |
        Preserve the exact identity, facial geometry, age, hairstyle,
        headdress, and wardrobe from the reference images.
        Do NOT copy the facial expression or body pose from the references.
        Render exactly the expression and pose described in the scene prompt.
      # 每个 shot 必须显式写明表情与姿态，例：
      # "expression: grim and resolute, jaw set, looking into the distance"
      require_expression_spec: true
      require_pose_spec: true

    voice:
      engine: qwen3-tts
      fallback_engine: kokoro-82m
      speaker: zm_yunxi
      speed: 1.0
      pitch: 0.0
      emotion: steady

    rhythm:
      fps: 25
      pad_head_ms: 100
      pad_tail_ms: 150
      min_shot_ms: 1600
      max_shot_ms: 6000
      # 单句超过此值强制在最近标点处拆镜头
      split_threshold_ms: 6000

    subtitle:
      font: 思源宋体
      font_size: 72
      primary_colour: "&H00FFFFFF"
      outline_colour: "&H00000000"
      back_colour: "&H80000000"
      outline: 4
      shadow: 1
      # 实测抖音 UI 遮挡区：底部约 280-350px，顶部约 200px
      margin_bottom: 320
      margin_top: 200
      max_chars_per_line: 15
      min_duration_ms: 800
      max_duration_ms: 4000
      keyword:
        font_size: 80
        primary_colour: "&H0000D7FF"
        scale_in_ms: 150

    motion:
      default_type: drift
      default_intensity: 0.08
      easing: ease_in_out
      # 输入为超分后的 2048x3584，裁切窗口 1080x1920
      # 水平余量 (2048-1080)/2 = 484px，垂直余量 (3584-1920)/2 = 832px
      # 推拉上限受短边约束：1080/2048 ≈ 0.527，即最远可拉到 1.9x
      input_resolution: [2048, 3584]
      output_resolution: [1080, 1920]
      crop_window: [1080, 1920]
      pan_margin_px: [484, 832]
      max_zoom: 1.15
      # 保守运镜模式：限制平移与缩放幅度，适配较低分辨率输入
      conservative_mode: true
      conservative_pan_ratio: 0.6     # 最多用掉 60% 可用平移余量
      downscale_filter: lanczos
      forbid_consecutive_same: true
      # 缓入缓出：取代线性 min(zoom+0.0015,1.5)，这是质感差异的关键
      zoom_easing_formula: "1.0 + {i} * (1 - cos(3.1415926 * on / {N})) / 2"

    bgm:
      volume: 0.18
      fade_out_sec: 5
