# 模型路径与降级链定义
# 降级必须记录日志并醒目标注，禁止静默降级
version: 1.0

# ---------- TTS ----------
tts:
  primary:
    engine: qwen3-tts
    model: Qwen/Qwen3-TTS-0.6B
    device: cuda
    dtype: fp16
    vram_GB: 3
  fallbacks:
    - engine: qwen3-tts
      dtype: fp16
      low_vram: true
      vram_GB: 2
    - engine: kokoro-82m
      device: cpu
      vram_GB: 0
    - engine: silent-placeholder
      alert: true

# ---------- 强制对齐 ----------
aligner:
  primary:
    type: torchaudio_mms_fa
    model: MMS_FA
    device: cuda
    level: char
  fallbacks:
    - type: ffmpeg_whisper
      model: ggml-base.bin
      level: segment
    - type: linear_estimate
      level: segment

# ---------- 生图 ----------
# 走 gpt-image-2（API），本地 SDXL 降级为兜底
image:
  primary:
    engine: gpt-image-2
    model: gpt-image-2
    api_base: ${OPENAI_API_BASE}      # 官方或中转，见 .env
    api_key_env: OPENAI_API_KEY
    endpoint_generate: /v1/images/generations
    endpoint_edit: /v1/images/edits   # 带参考图时走此端点
    size: "1024x1792"                 # HD 竖屏，成本最低档
    quality: low                      # M1 迭代用 low；成片改 high
    n: 1
    # ⚠️ 硬约束：1024x1792 小于目标输出 1080x1920（宽少 56px、高少 128px）
    #    → 超分是必选项，不是可选优化，否则成片达不到 1080p
    requires_upscale: true
    # ★ 关键约束：gpt-image-2 不暴露 seed，也不提供持久 character id
    #   → 缓存键不含 seed；一致性完全依赖「反复喂同一组参考图」
    supports_seed: false
    supports_character_id: false
    max_reference_images: 16
    reference_upload: multipart       # image[] 字段，支持本地文件
    concurrency: 6
    batch_api:                        # 容忍 24h 延迟时费用减半
      enabled: false
      endpoint: /v1/batches

  # 后处理：本地超分 —— 必需环节（见上方 requires_upscale）
  # 1024x1792 → 2048x3584，既补足 1080p 输出，又提供运镜裁切余量
  # 本地 12GB 显存运行，零 API 成本
  postprocess:
    upscale:
      enabled: true
      engine: realesrgan
      model: RealESRGAN_x2plus
      scale: 2
      device: cuda
      tile: 512                       # 分块，避免大图爆显存
      output_size: [2048, 3584]
      # 裁切到 1080x1920 后的余量
      crop_margin_px: [484, 832]

  # 一致性：角色参考包
  consistency:
    strategy: reference_pack
    # 每个角色生成 10-16 张多角度定妆照，作为 image[] 反复喂入
    ref_pack_size: 12
    # 参考图会传递表情与姿态，必须在 prompt 中显式覆盖
    override_expression: true
    override_pose: true
    # 自动抽检：与 anchor 的人脸 embedding 余弦相似度
    face_sim_threshold: 0.65
    face_sim_warn: 0.50
    max_retry: 3

  # ⚠️ 降级链依据实测结果编写，不可写原生 SDXL fp16（装不下）
  fallbacks:
    - engine: gpt-image-2
      size: "1024x1792"               # 同引擎降档重试
    - engine: diffusers_sdxl
      dtype: fp8                      # 必须量化：fp16 权重 6.95GB > 上限 6.00GB
      device: cuda
      enable_attention_slicing: true  # 必须开，压缩激活内存
      enable_vae_tiling: true
      concurrency: 1
      # 4.2GB 权重 + 约 1.5GB 激活 ≈ 5.7GB / 上限 6.00GB
      note: 临界可行，上线前必须跑 bin/probe_sdxl_vram.py 实测确认
    - engine: diffusers_sd15          # 更保险的本地兜底
      dtype: fp16
      lora: ancient-chinese-v1
      # 2.1GB 权重 + 1.5GB 激活 ≈ 3.6GB，余量充足
      note: 画质明显低于 SDXL，仅作应急
    - engine: scene_library_reuse
    - engine: solid_color_card

# ---------- 图生视频（I2V）----------
# 英雄镜头策略：每集仅 8-15 个高光镜头走 I2V，其余走本地 Ken Burns
# 理由：视频成本降 60-80%，且 I2V 过程中人脸/手部最易崩，
#       全镜头 I2V 反而抬高一致性风险
video:
  enabled: true
  strategy: hero_shots_only
  hero_shots_per_episode: [8, 15]

  primary:
    engine: relay_i2v
    # 与生图共用同一中转
    api_base: ${OPENAI_API_BASE}
    api_key_env: OPENAI_API_KEY
    # ★ 以下四项未知，必须由 bin/probe_video_api.py 扫描后回填
    #   各家 I2V 的端点路径、模型名、图片字段命名、同步/异步模式差异极大
    endpoint: null
    model: null
    image_field: null          # image / image_url / image_urls / images / file
    async: null                # 是否返回 task_id 需要轮询
    duration_sec: 5
    concurrency: 3

  # 非英雄镜头：本地 Ken Burns（零成本、零一致性风险）
  fallback_motion:
    engine: ffmpeg_kenburns
    pan_impl: crop
    zoom_impl: zoompan

  cost_control:
    # 按音频时长选档位，避免生成 5s 却只裁 2s 的浪费
    match_duration_to_audio: true
    max_waste_ratio: 0.35
    # 生成后校验：与源图的人脸相似度，低于阈值则回退 Ken Burns
    face_sim_threshold: 0.60
    on_face_drift: fallback_to_kenburns

  fallbacks:
    - engine: ffmpeg_kenburns   # API 失败则全片退回 Ken Burns
    - engine: static_freeze

# ---------- 运镜 ----------
motion:
  primary:
    engine: ffmpeg
    pan_impl: crop
    zoom_impl: zoompan
    supersample: 2
  fallbacks:
    - supersample: 1
    - engine: static_freeze

# ---------- 合成 ----------
compose:
  primary:
    video_encoder: h264_nvenc
    preset: p4
    cq: 20
  fallbacks:
    - video_encoder: libx264
      preset: medium
      crf: 20
    - video_encoder: libx264
      preset: veryfast
      crf: 23
  audio:
    codec: aac
    bitrate: 192k

# ---------- 环境 ----------
runtime:
  python_venv: C:\Users\coumoo\.workbuddy\binaries\python\envs\hv
  ffmpeg: ffmpeg

  # ⚠️ 显存：报告值虚高，判定可行性一律用 measured_usable_GB
  vram:
    reported_total_GB: 12.00
    reported_free_GB: 10.95
    measured_usable_GB: 6.00      # 单进程累积分配实测上限，以此为准
    unallocatable_GB: 4.95
    cause: Windows WDDM 驱动模型下 mem_get_info 报告值不可分配
    probe_script: bin/probe_sdxl_vram.py
    rule: 任何新模型上线前，先跑探测脚本比对 measured_usable_GB

  # nvidia-smi 在本机因 GameViewer 远控虚拟显卡导致 NVML 不可用
  # 监控改用 torch.cuda.mem_get_info()，不依赖 nvidia-smi
  monitor:
    type: torch_cuda
    nvidia_smi_available: false
