# hv 主配置（合并自旧 config/style.yaml + config/models.yaml）
#
# 重大修订（2026-09-03 subrouter.ai 探测后）：
#   - style.image.size: "1024x1792" → "1080x1920"
#     理由：中转把总像素钳制在 1,572,864，请求 size 只控长宽比。
#           1080x1920 (9:16 精确) → 预计产出 940x1672 → ×2 = 1880x3344。
#           比 1024x1792 (948x1659 → 1896x3318) 垂直余量更足 (1424 vs 1398)
#           且零比值浪费。
#   - style.motion.input_resolution / pan_margin_px: 改为 "dynamic"
#     实际值由 app/services/upscale.py 算（基于 gpt-image-2 返回图真实像素）。
#   - 旧 config/models.yaml 里的 "API_BASE / API_KEY_ENV 占位 ${OPENAI_API_BASE}"
#     全部改为具体字段，由 .env 渠道池发现机制驱动。

version: 1.0
default_profile: ancient-realistic

# ===========================================================================
# 风格 profile（继承自旧 style.yaml）
# ===========================================================================
profiles:
  ancient-realistic:
    name: 古风写实

    asr:
      backend: local-whisper
      python_executable: .venv-asr/Scripts/python.exe
      model_dir: .cache/asr/faster-whisper-small
      threads: 4
      timeout_seconds: 180

    image:
      engine: gpt-image-2
      size: "1080x1920"                # 9:16 精确，请求后预计产出 940x1672
      quality: low                      # low 即可拿满 1.57MP
      upscale: 2
      style_suffix: >-
        ancient chinese historical painting style, cinematic composition,
        dramatic lighting, warm earthy tone, highly detailed, masterpiece,
        film grain
      negative_clause: >-
        No modern elements, no electric wires, no concrete, no text,
        no watermark, no signature, no extra limbs, no extra fingers,
        no mutated hands, no cartoon, no anime, no 3d render,
        no plastic skin.
      identity_anchor_template: |
        Preserve the exact identity, facial geometry, age, hairstyle,
        headdress, and wardrobe from the reference images.
        Do NOT copy the facial expression or body pose from the references.
        Render exactly the expression and pose described in the scene prompt.
      require_expression_spec: true
      require_pose_spec: true

    voice:
      # 实际出片引擎由 app/services/voice.py 决定
      # 2026-09-08 切到 qwen：免费额度大（3.6万次）、设计音色+instruction+
      # hot_fix 官方多音字修复都支持；A/B 实测响度std 41.0（cosyvoice 指令版
      # 13.65、SSML 26.58），PER 0.6%，组间 F0 极差 29Hz（一致）。
      # 2026-09-09 切回 cosyvoice-v3.5-flash：qwen 免费额度已耗尽。
      # flash 档 ¥0.8/万字符（单集 15min 约 ¥0.29）；SSML 路线在 cosyvoice
      # v3.5 上同样实测可用，故 W5 的确定性起伏得以保留。
      engine: cosyvoice
      speaker: zm_yunxi
      speed: 1.0
      pitch: 0.0
      emotion: steady
      # ---- CosyVoice 音色塑形 ----
      # ⚠️ 2026-09-03 试听结论：A/B 了 6 个候选后，用户选回【原生音色】。
      #    压低音调(pitch_rate<1)会让男声发闷失真；"浑厚"指令反而更差。
      #    所以这里保持中性：pitch_rate 1.0 = 服务端原生。
      #    塑形能力已实现在 cosyvoice.py，需要时在此显式配置即可，勿改代码兜底。
      pitch_rate: 1.0
      speech_rate: null
      volume: null
      # 2026-09-08 出片后用户反馈「语音太平、没有起伏」→ 启用自然语言风格指令。
      # 实测响度动态（0.5s 窗 RMS 的 std）：无指令 5.65 → 有指令 22.17
      # （"现状"旧音色 4.57，用户评为"平"）。
      # ⚠️ 必须是**内容无关**的通用情绪指令：这条会作用于每一组，
      #    不能写「读到某某词时放慢」这种只适用于某一段的描述。
      # W5 结论：instruction 是整段提示 → 模型自由发挥 → 组间漂移。
      # 起伏改用 SSML 逐句 rate（确定性）。留空；实验时可临时填回。
      instruction: null

      # ---- qwen-audio-3.0-tts ----
      # 官方示例指令（纪录片解说场景原话），W1 实测效果最佳
      qwen_model: qwen-audio-3.0-tts-flash
      cosyvoice_model: cosyvoice-v3.5-flash
      voice_asset: state/voice_assets/cosyvoice-v3.5-flash-hvndrama.json
      # 逐句 SSML（rate 定起伏 + phoneme 定读音），引擎无关，开即生效。
      # ⚠️ 开着 SSML 时不要同时配 instruction：实测两者叠加会打架（W4 更差）。
      tts_ssml: true
      qwen_rate: null
      qwen_instruction: "沉稳的中年男性，语速缓慢，音色低沉有磁性，适合朗读历史纪录片解说。"
      qwen_hot_fix:
        replace:
          - 万石: 万担
          - 晋阳令刘文静: 晋阳县令刘文静

    # 2026-09-05 整改 C2 起，本段**真正生效**（此前 compose.py 里全是硬编码，
    # 改这里完全不起作用）。改完记得它确实会影响出片。
    subtitle:
      font: 思源宋体
      font_size: 72
      primary_colour: "&H00FFFFFF"
      outline_colour: "&H00000000"
      back_colour: "&H80000000"
      # outline = 字幕描边宽度。原值 4 与代码里硬编码的 5 不一致（代码从未读它）；
      # 现以已交付成片的实际观感为准取 5。想要更细的描边改回 4，这次会真的生效。
      outline: 5
      shadow: 1
      margin_bottom: 320
      margin_top: 200
      max_chars_per_line: 15
      min_duration_ms: 800
      max_duration_ms: 4000
      keyword:
        font_size: 80
        primary_colour: "&H0000D7FF"
        scale_in_ms: 150

    motion:
      default_type: drift
      default_intensity: 0.08
      easing: ease_in_out
      input_resolution: dynamic           # 由 upscale.py 基于实际返回像素算
      output_resolution: [1080, 1920]
      crop_window: [1080, 1920]
      pan_margin_px: dynamic              # 同上
      max_zoom: 1.15
      conservative_mode: true
      conservative_pan_ratio: 0.6
      downscale_filter: lanczos
      forbid_consecutive_same: true
      zoom_easing_formula: "1.0 + {i} * (1 - cos(3.1415926 * on / {N})) / 2"

    bgm:
      volume: 0.18
      fade_out_sec: 5

# ===========================================================================
# （顶层 tts 死配置已删：voice.py 实际用 cosyvoice 主 / edge 回退，由
#  profile.voice 塑形参数 + voice.py 常量驱动；旧 qwen3-tts/kokoro 段无生产
#  代码读取，保留误导。）
# ===========================================================================

# ===========================================================================
# ===========================================================================
# 生图（继承自旧 models.yaml.image，重大修订）
# ===========================================================================
# Supplier availability checked with bounded real requests on 2026-09-22.
# Model variants share a supplier key and its concurrency limit.
image_channels:
  - name: cxk
    key_env: cxk_gpt-image-2
    enabled: true
    max_concurrency: 1
    models: [gpt-image-2, gpt-image-2.5, gpt-image-2.5-flare, gpt-image-2.5-sunburst]
  - name: aicost
    key_env: aicost_gpt-image-2
    enabled: false
    max_concurrency: 1
    # 2026-09-22 bounded probes: flare and sunburst returned HTTP 503,
    # "no available channel". The base model returned the same 503 in the
    # final bounded probe. Restore this supplier only after an explicitly
    # budgeted successful probe, never by automatic retry.
    models: [gpt-image-2]
  - name: qcyc  # QC_YC
    key_env: qcyc_gpt-image-2
    # 2026-09-23 恢复启用（用户决定）：分担 cxk 的串行压力
    # （此前只有 cxk 一条渠道 + max_concurrency 1，是生图 ~50s/img 的直接原因）。
    # ⚠️ models 必须与服务端**实际**能力一致 —— 用 GET /v1/models 当场核对
    #    （免费、即时，比翻历史成功率可靠）。2026-09-23 15:22 实测该 key 返回：
    #      ['gpt-image-2', 'gpt-image-2.5-sunburst']
    #    故**不写 gpt-image-2.5-flare**（用户明确说它今天还不能用，服务端列表
    #    里也确实没有）。写进去会让 supports() 误判为可用 → 派活后失败。
    #    同一次探测里 cxk 返回 5 个模型（含 flare），说明列表是按 key 区分的真数据。
    # 历史：2026-09-07 审计 ok_rate=0.4375（n_history=32）故被暂停；
    #      同日 15:0x 首次探测该 key 返回 0 个模型，15:22 复测返回 2 个
    #      —— 服务端能力会随时变化，**每次启用前都要当场核对**。
    enabled: true
    max_concurrency: 1
    models: [gpt-image-2, gpt-image-2.5-sunburst]

image:
  primary:
    engine: gpt-image-2
    model: gpt-image-2
    api_base: https://subrouter.ai          # 由 .env 中 gpt-image-2_API_BASE 覆盖
    api_key_env: null                       # 走三渠道池，不再用单一 env
    endpoint_generate: /v1/images/generations
    endpoint_edit: /v1/images/edits
    size: "1080x1920"                       # 9:16 精确
    quality: low
    n: 1
    response_format: b64_json
    timeout_s: 300                          # 实测 33s，留 9× 余量
    max_reference_images: 16
    concurrency: 6
    requires_upscale: true
    supports_seed: false
    supports_character_id: false
    # ★ 严格模式：subrouter 会静默忽略非法 size/quality 并真去生成
    #   生产建议保持 false（不严格）；调试时设 true 让 image.py 主动拒绝
    #   已知非法值，避免真去生成计费
    strict_param_validation: false

  postprocess_upscale:
    enabled: true
    # ★ 单一真源：engine 必须与 app/services/upscale.py 实装一致。
    #   当前实装为 pil_lanczos（零依赖、快、够做运镜余量）。
    #   RealESRGAN_x2plus（M2 升级）basicsr 编译问题未解决，启用会抛
    #   NotImplementedError，故【不得】在此声明为已启用，避免配置与运行
    #   事实冲突（2026-09-04 审计收敛）。待 M2 落地后再改回 realesrgan。
    engine: pil_lanczos
    model: RealESRGAN_x2plus          # 仅 realesrgan engine 时生效（占位）
    scale: 2
    device: cuda
    tile: 512
    output_size_dynamic: true               # 基于返回图实际像素 × scale 算

  # C3（2026-09-05）：原 consistency 段（定妆包 + 人脸相似度）随
  # character_lock.py / face.py 一并删除。它从未被代码读取过。

  fallbacks:
    - engine: gpt-image-2
      size: "1080x1920"
    - engine: diffusers_sdxl
      dtype: fp8
      device: cuda
      enable_attention_slicing: true
      enable_vae_tiling: true
      concurrency: 1
      note: 临界可行，上线前必须跑 bin/probe_sdxl_vram.py 实测确认
    - engine: diffusers_sd15
      dtype: fp16
      lora: ancient-chinese-v1
      note: 画质明显低于 SDXL，仅作应急
    - engine: scene_library_reuse
    - engine: solid_color_card

# ===========================================================================
# 视频（I2V，继承自旧 models.yaml.video，subrouter 端点已确认）
#   ★ enabled 必须是运行事实：当前【未实现生产 I2V】（app 内无生成服务，
#     仅探测脚本 + relay 状态接口，见 app/controllers/v1/video.py）。
#     运镜/动态由 motion(ffmpeg zoompan/crop) 承担。故 enabled=false。
#     待 I2V 生产链路(任务查询+fallback_kenburns)落地后改回 true。
# ===========================================================================
video:
  enabled: false
  strategy: hero_shots_only
  hero_shots_per_episode: [8, 15]

  primary:
    engine: relay_i2v
    api_base: https://subrouter.ai
    model: gpt-image-2
    endpoint: /v1/videos
    task_based: true
    image_field: null                       # 待 T2 探测（base64 数组？image_urls？）
    duration_sec: 5
    timeout_s: 900
    poll_interval_s: 10
    concurrency: 3
    match_duration_to_audio: true
    max_waste_ratio: 0.35
    face_sim_threshold: 0.60
    on_face_drift: fallback_to_kenburns

  fallbacks:
    - ffmpeg_kenburns
    - static_freeze

# ===========================================================================
# 合成（运镜实现全在 app/services/motion.py，此处无配置项）
# ===========================================================================
compose:
  video_encoder: h264_nvenc
  preset: p4
  cq: 20
  fallbacks:
    - video_encoder: libx264
      preset: medium
      crf: 20
    - video_encoder: libx264
      preset: veryfast
      crf: 23
  audio_codec: aac
  audio_bitrate: 192k
  # P1 2.1：ffmpeg 收口超时秒数。0 = 不设超时（默认保守）；若担心编码卡死可设如 1200。
  timeout_sec: 0
  # 分段渲染（2026-09-04）：按段预渲染视频再 concat copy + 一次混音。
  segment_max_sec: 90        # 单段最长秒数（镜头边界切）
  # v2 production 逐帧 PIL 路径的段长；默认 300s watchdog 下应能收口。
  v2_segment_max_sec: 45
  segment_min_frames: 2500   # 全片 < 此帧数仍走旧单段路径（保短片行为不变）

# ===========================================================================
# 运行时 / 显存
# ===========================================================================
runtime:
  python_venv: C:\Users\coumoo\.workbuddy\binaries\python\envs\hv
  ffmpeg: ffmpeg
  vram:
    reported_total_GB: 12.00
    reported_free_GB: 10.95
    measured_usable_GB: 6.00
    unallocatable_GB: 4.95
    cause: Windows WDDM 驱动模型下 mem_get_info 报告值不可分配
    rule: 任何新模型上线前，先跑探测脚本比对 measured_usable_GB
  nvidia_smi_available: false
