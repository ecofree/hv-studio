# 历史专有名词读音表 —— 历史类账号的隐形门槛
#
# 背景：TTS 对古国名、民族名、人名地名的多音字判断普遍不可靠。
#       "月氏(zhī)" 读成 "yuè shì"、"冒顿(mò dú)" 读成 "mào dùn"、
#       "吐蕃(tǔ bō)" 读成 "tǔ fān"，评论区会立刻盖楼。
#       这类错误是历史号最常见的翻车点，且一旦发出无法挽回。
#
# 策略：TTS 前做文本预处理，将专有名词替换为同音常用字。
#       这是跨引擎通用的兜底方案（Kokoro / Qwen3 / CosyVoice 均适用）。
#
# 局限与进阶：
#   - 同音字替换在个别引擎上可能轻微影响韵律，需实测调优
#   - 若引擎支持 SSML <phoneme> 或音素标注，优先用原生注音（更准）
#   - 本表按题材持续积累，是长期资产
#
# 格式：原词 -> 替换为
version: 1.0

rules:
  # ===== 民族 / 国名 / 政权 =====
  月氏: 月支              # yuè zhī，非 shì
  大月氏: 大月支
  小月氏: 小月支
  冒顿: 墨毒              # mò dú
  阏氏: 烟支              # yān zhī，匈奴皇后称号
  龟兹: 丘慈              # qiū cí
  大宛: 大渊              # dà yuān
  康居: 康渠              # kāng qú
  乌孙: 乌荪              # wū sūn
  身毒: 捐毒              # juān dú，古印度
  单于: 缠于              # chán yú，非 dān yú / shàn yú
  可汗: 克寒              # kè hán
  吐蕃: 吐波              # tǔ bō，非 fān
  回鹘: 回胡              # huí hú，非 gǔ
  高句丽: 高勾离          # gāo gōu lí，非 gāo jù lì
  吐谷浑: 吐玉魂          # tǔ yù hún
  柔然: 揉然
  突厥: 突决
  鲜卑: 先卑
  契丹: 气丹              # qì dān
  休屠: 休除              # xiū chú，休屠王
  昆邪: 浑爷              # hún yé，昆邪王
  先零: 先连              # xiān lián，羌族一支

  # ===== 人名 =====
  郦食其: 郦异基          # lì yì jī
  伍子胥: 伍子须
  范雎: 范居              # fàn jū，非 suī
  乐毅: 岳义              # yuè yì，非 lè
  曹参: 曹餐              # cáo cān，非 shēn
  华佗: 化驼              # huà tuó，非 huá
  李悝: 李亏              # lǐ kuī
  甘父: 甘甫              # gān fǔ，张骞向导，非 fù
  冒顿单于: 墨毒缠于
  呼韩邪: 呼韩爷          # hū hán yé
  尉迟: 玉迟              # yù chí
  长孙: 掌孙              # zhǎng sūn
  扁鹊: 匾鹊              # biǎn què
  李广: 李广
  # 官名「骑都尉」读 jì dū wèi，不是 qí。2026-09-08 实测听到了 qí。
  # ⚠️ 只能整词替换：本片另有「尉迟恭」（yù chí），单换「尉」会互相打脸。
  骑都尉: 季都尉
  # 「晋阳令刘文静」在**段落级**长上下文里必被读断成「晋阳 / 令刘文静」
  # （实测 ≥45 字必错，而段落级中位 65 字）。加「县」字实测读对。
  # 字幕仍显示「晋阳令刘文静」，只有送 TTS 的文本变了（与月氏→月支同理）。
  晋阳令刘文静: 晋阳县令刘文静

  # ===== 地名 =====
  马邑: 马义
  龙城: 龙城
  祁连山: 祁连山
  焉支山: 烟支山          # yān zhī shān
  焉耆: 烟其              # yān qí
  上林苑: 上林院
  龟蒙: 龟蒙

  # ===== 常见易错 =====
  汗血宝马: 汗血宝马
  大夏: 大夏
  条支: 条支
  楼兰: 楼兰
  # ===== 罕见字（TTS 常按形近字读错）=====
  # 不写单字规则：单字 = 全文无差别替换，误伤不可控（例：单字规则 羯→杰 会把
  # 「摩羯座」改成「摩杰座」）。_load() 会硬拦 key < 2 字的规则。
  # 要修就按词组修，命中面小、可预期。
  氐族: 低族                  # dī zú（TTS 易把 氐 当 氏 读 shì）
  氐人: 低人
  羌族: 枪族                  # qiāng
  羌人: 枪人
  西羌: 西枪
  羯族: 杰族                  # jié
  羯人: 杰人
  羯鼓: 杰鼓

# 说明：
#   1. 本表在 stage tts 之前作为文本预处理器运行
#   2. 替换采用最长匹配优先（如"大月氏"优先于"月氏"）
#   3. 每次新增条目需人工听测验证，不可批量盲加
#   4. 命中日志需记录，便于发现漏网之鱼
