[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m production --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "production: current V2 production contracts; default acceptance suite",
    "shared: shared adapters and maintenance; run for component changes",
    "legacy: optional legacy-preview compatibility; not production evidence",
    "NEEDS_FFMPEG: 用例需要本机 ffmpeg/ffprobe；缺件应 skip 而不是 red",
    "slow: 端到端/耗时用例（如 hv smoke 全链路）",
]
